<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icono de Atalaya: torre de vigilancia con luz de vigía -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233047"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- halo de la luz de vigía -->
  <circle cx="128" cy="78" r="52" fill="url(#glow)"/>

  <!-- luz de vigía -->
  <circle cx="128" cy="78" r="15" fill="#7fb0ff"/>

  <!-- almenas -->
  <path fill="#e8ecf4" d="M84 104 h20 v16 h20 v-16 h8 v16 h20 v-16 h20 v34 H84 Z"/>

  <!-- fuste de la torre, ligeramente atalonado -->
  <path fill="#e8ecf4" d="M94 138 h68 l10 74 H84 Z"/>

  <!-- tronera (ventana vertical) -->
  <rect x="122" y="152" width="12" height="34" rx="6" fill="#233047"/>

  <!-- base -->
  <path fill="#e8ecf4" d="M76 212 h104 v16 H76 Z"/>
</svg>
